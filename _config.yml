# Título do site
title: 'Blog DaJoana | Cosmética Natural'

# Email de contacto
email: cosmeticanatural_formacao@dajoana.com

# Descrição que aparece nos metadados e motores de busca
description: >
  "Explore artigos e tendências em cosmética natural, com dicas práticas, receitas caseiras e soluções ecológicas para cuidar da sua pele todos os dias.""

# Mantém vazio se usas domínio próprio como www.dajoana.com
baseurl:

# Domínio do site
url: 'https://www.dajoana.com'

# Tema Jekyll (podes personalizar depois)

# Plugins para feeds e SEO
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Processador Markdown
markdown: kramdown

# URLs mais limpas: www.dajoana.com/artigos/titulo-em-vez-de-html
permalink: /:categories/:title/

# Coleção personalizada chamada blog
collections:
  blog:
    output: true
    permalink: /blog/:title/

defaults:
  - scope:
      path: '' # Aplica-se a todo o site
      type: 'posts' # Apenas aos posts
    values:
      layout: 'post'
      author: 'Susana Soares Silva'
      permalink: /blog/:title/
      lang: 'pt-PT'

  - scope:
      path: '' # Aplica-se a todas as páginas
      type: 'posts'
    values:
      layout: 'post'
      author: "Susana Soares da Silva"
      category: jekyll
      lang: 'pt-PT'


# Favicon (se usares)
# favicon: /assets/favicon.ico

# Google Analytics (se quiseres usar no futuro)
# google_analytics: UA-XXXXXXXXX-X
