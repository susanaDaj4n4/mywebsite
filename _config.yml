title: 'Blog DaJoana | Cosmética Natural'
email: cosmeticanatural_formacao@dajoana.com
description: >
  Explore artigos e tendências em cosmética natural, com dicas práticas, receitas caseiras e soluções ecológicas para cuidar da sua pele todos os dias.

baseurl: '' # importante se usares GitHub Pages
url: 'https://www.dajoana.com'

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2

markdown: kramdown
permalink: /:categories/:title/

pagination:
  enabled: true
  per_page: 5
  permalink: '/blog/page:num/'
  title: ':title - Página :num'
  trail:
    before: 2
    after: 2

defaults:
  - scope:
      path: '' # Aplica a todo o site
      type: 'posts'
    values:
      layout: 'post'
      author: 'Susana Soares da Silva'
      lang: 'pt-PT'
