<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% if page.title %}{{ page.title }} | {% endif %}DaJoana | Cursos de
      Cosmética Natural Online
    </title>
    <link rel="icon" href="/logo_usado/favicon-32x32.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <meta
      name="description"
      content="{% if page.description %}{{ page.description }}{% else %}Aprenda a criar cosméticos naturais com os nossos cursos online. Cosmética vegana, artesanal e feita por si. DaJoana - Cosmética Natural.{% endif %}"
    />

    <!-- SEO -->
    <meta
      property="og:title"
      content="{% if page.title %}{{ page.title }} | {% endif %}DaJoana | Cursos de Cosmética Natural Online"
    />
    <meta
      property="og:description"
      content="{% if page.description %}{{ page.description }}{% else %}Aprenda a criar os seus próprios cosméticos naturais com os cursos online, fórmulas gratuitas e workshops da DaJoana.{% endif %}"
    />
    <meta
      property="og:image"
      content="/imagem/VECTOR SVG PDF JPEG/VSMALL JPEG HIRES.jpg"
    />
    <meta property="og:url" content="https://www.dajoana.com" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="/css/normalize.css" />
    <link rel="stylesheet" href="/css/main.css" />
  </head>

  <body class="fx js">
    <!-- Logo mobile -->
    <div class="logo-icon md-hide">
      <img src="/logo_usado/SVG FILE.svg" alt="DaJoana Logo" width="150" />
      <!-- Ícone hamburguer -->
      <a href="#" id="hamburguer-menu" aria-expanded="false" class="menu-icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5M12 17.25h8.25"
          />
        </svg>
      </a>
    </div>

    {% include header.html %}

    <main class="container my-5">{{ content }}</main>

    {% include footer.html %}
  </body>
</html>
