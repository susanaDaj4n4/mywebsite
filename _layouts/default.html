<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>
      {% if page.title %}{{ page.title }} | {% endif %}DaJoana Cosmética Natural
    </title>
    <meta
      name="description"
      content="{% if page.description %}{{ page.description }}{% else %}Aprenda a criar cosméticos naturais com os nossos cursos online. Cosmética vegana, artesanal e feita por si. DaJoana - Cosmética Natural.{% endif %}"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="{{ page.title | default: 'DaJoana Cosmética Natural' }}"
    />
    <meta
      property="og:description"
      content="{{ page.description | default: 'Aprenda a criar os seus próprios cosméticos naturais com cursos online, fórmulas gratuitas e workshops.' }}"
    />
    <meta
      property="og:image"
      content="{{ page.image | default: '/imagem/social-share.jpg' }}"
    />
    <meta property="og:url" content="https://www.dajoana.com{{ page.url }}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_PT" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="{{ page.title | default: 'DaJoana Cosmética Natural' }}"
    />
    <meta
      name="twitter:description"
      content="{{ page.description | default: 'Aprenda a criar os seus próprios cosméticos naturais com cursos online, fórmulas gratuitas e workshops.' }}"
    />
    <meta
      name="twitter:image"
      content="{{ page.image | default: '/imagem/social-share.jpg' }}"
    />

    <!-- Favicon -->
    <link rel="icon" href="/logo_usado/favicon-32x32.ico" type="image/x-icon" />

    <!-- Fonts e Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Estilos -->
    <link rel="stylesheet" href="/css/normalize.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/main.css?v=2" />
  </head>

  <body class="fx js">
    {% include header.html %}

    <!-- Conteúdo principal -->
    <main class="container my-5">{{ content }}</main>

    <!-- Rodapé -->
    {% include footer.html %}

    <script src="/js/hamburguer-menu.js"></script>
  </body>
</html>
