<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>
      {% if page.title %}{{ page.title }} | {% endif %}DaJoana Cosmética Natural
    </title>
    <meta
      name="description"
      content="{% if page.description %}{{ page.description }}{% else %}Aprenda a criar cosméticos naturais com os nossos cursos online. Cosmética vegana, artesanal e feita por si. DaJoana - Cosmética Natural.{% endif %}"
    />

    <!-- SEO Open Graph -->
    <meta
      property="og:title"
      content="{{ page.title | default: 'DaJoana Cosmética Natural' }}"
    />
    <meta
      property="og:description"
      content="{{ page.description | default: 'Aprenda a criar os seus próprios cosméticos naturais com cursos online, fórmulas gratuitas e workshops.' }}"
    />
    <meta
      property="og:image"
      content="{{ page.image | default: '/imagem/banner-home.jpg' }}"
    />
    <meta property="og:url" content="https://www.dajoana.com{{ page.url }}" />
    <meta property="og:type" content="website" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="{{ page.title | default: 'DaJoana Cosmética Natural' }}"
    />
    <meta
      name="twitter:description"
      content="{{ page.description | default: 'Aprenda a criar os seus próprios cosméticos naturais com cursos online, fórmulas gratuitas e workshops.' }}"
    />
    <meta
      name="twitter:image"
      content="{{ page.image | default: '/imagem/banner-home.jpg' }}"
    />

    <!-- Favicon -->
    <link rel="icon" href="/logo_usado/favicon-32x32.ico" type="image/x-icon" />

    <!-- Fonts e Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Estilos -->
    <link rel="stylesheet" href="/css/normalize.css" />
    <link rel="stylesheet" href="/css/main.css" />
  </head>

  <body class="fx js">
    <!-- Logo mobile -->
    <div class="logo-icon md-hide">
      <a href="/">
        <img src="/logo_usado/SVG FILE.svg" alt="DaJoana Logo" width="150" />
      </a>
      <!-- Ícone hamburguer -->
      <a href="#" id="hamburguer-menu" aria-expanded="false" class="menu-icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5M12 17.25h8.25"
          />
        </svg>
      </a>
    </div>

    <!-- Header -->
    <header class="header" data-paralax data-p-velocity="0.5">
      <div class="container">
        <!-- Logo desktop -->
        <div class="logo-icon__logo sm-hide md-show">
          <a href="/">
            <img
              src="/logo_usado/SVG FILE.svg"
              class="top_header_logo"
              alt="DaJoana Logo"
              width="200"
            />
          </a>
        </div>

        <!-- Navegação -->
        <nav class="header-nav" role="navigation">
          <ul id="header__navList" class="header__navList" aria-hidden="true">
            <li><a href="/">Home</a></li>
            <li><a href="/sobre.html">Sobre</a></li>
            <li><a href="/cursos.html" id="linkCursos">Cursos</a></li>
            <li><a href="#footer__socialLinks">Contactos</a></li>
            <li>
              <a
                href="https://cosmeticaformacao.gumroad.com/l/livro-de-receitas-da-avo"
                >Livro d'Avó</a
              >
            </li>
            <li><a href="/blog/">Blog</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="container my-5">{{ content }}</main>

    <!-- Rodapé -->
    <footer id="footer__socialLinks" class="footer">
      <div class="container">
        <p>
          &copy; 2025 DaJoana Cosmética Natural – Susana Maria Soares da Silva,
          NIF 213978059
        </p>
        <p>
          <a href="https://www.livroreclamacoes.pt/">Livro de Reclamações</a> |
          <a href="https://ec.europa.eu/consumers/odr">Resolução de Litígios</a>
          | <a href="/politica-privacidade.html">Política de Privacidade</a> |
          <a href="/cookies.html">Política de Cookies</a>
        </p>
        <div class="social-icons">
          <ul class="footer__socialLinks" id="footer__socialLinks">
            <li>
              <a href="https://www.instagram.com/dajoana_cosmeticaformacao/"
                ><i class="fa-brands fa-square-instagram"></i
              ></a>
            </li>
            <li>
              <a href="https://www.youtube.com/@dajoanacosmeticanatural"
                ><i class="fa-brands fa-youtube"></i
              ></a>
            </li>
            <li>
              <a href="https://www.tiktok.com/@dajoana_cosmetica"
                ><i class="fa-brands fa-tiktok"></i
              ></a>
            </li>
            <li>
              <a href="https://www.linkedin.com/in/dajoanacosmetica"
                ><i class="fa-brands fa-linkedin"></i
              ></a>
            </li>
          </ul>
        </div>
      </div>
    </footer>
  </body>
</html>
