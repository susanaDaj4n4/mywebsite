---
layout: default
---

<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <p>
      <small>{{ page.date | date: "%d de %B de %Y" }} | Por {{ page.author }}</small>
    </p>
  </header>

  {% if page.description %}
    <p><em>{{ page.description }}</em></p>
  {% endif %}

  {% if page.image %}
    <img src="{{ page.image }}" alt="Imagem de destaque" class="post-featured-image" />
  {% endif %}

  <section class="post-content">
    {{ content }}
  </section>
</article>
